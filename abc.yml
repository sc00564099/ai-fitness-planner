...
...
#---------------------------------------------------------------------
# common defaults that all the 'listen' and 'backend' sections will
# use if not designated in their block
#---------------------------------------------------------------------
defaults
  ...
  ... 
#---------------------------------------------------------------------
# main frontend which proxys to the backends
#---------------------------------------------------------------------
frontend stats
  bind *:1936
  mode            http
  log             global
  maxconn 10
  stats enable
  stats hide-version
  stats refresh 30s
  stats show-node
  stats show-desc Stats for ocp4 cluster
  stats uri /stats

#---------------------------------------------------------------------
# Port 6443 handles the Kubernetes API traffic and points to the
# control plane machines.
#---------------------------------------------------------------------
listen api-server-6443
  bind *:6443
  mode tcp
  server bootstrap bootstrap.<cluster-name>.<base-domain>:6443 check inter 1s backup
  server master0 master0.<cluster-name>.<base-domain>:6443 check inter 1s
  server master1 master1.<cluster-name>.<base-domain>:6443 check inter 1s
  server master2 master2.<cluster-name>.<base-domain>:6443 check inter 1s

#---------------------------------------------------------------------
# Port 22623 handles the machine config server traffic and points to
# the control plane machines.
#---------------------------------------------------------------------
listen machine-config-server-22623
  bind *:22623
  mode tcp
  server bootstrap bootstrap.<cluster-name>.<base-domain>:22623 check inter 1s backup
  server master0 master0.<cluster-name>.<base-domain>:22623 check inter 1s
  server master1 master1.<cluster-name>.<base-domain>:22623 check inter 1s
  server master2 master2.<cluster-name>.<base-domain>:22623 check inter 1s

#---------------------------------------------------------------------
# Port 443 handles the HTTPS traffic and points to the machines that
# run the Ingress Controller pods.
#---------------------------------------------------------------------
listen ingress-router-443
  bind *:443
  mode tcp
  balance source
  server worker0 worker0.<cluster-name>.<base-domain>:443 check inter 1s
  server worker1 worker1.<cluster-name>.<base-domain>:443 check inter 1s
  server worker2 worker2.<cluster-name>.<base-domain>:443 check inter 1s

#---------------------------------------------------------------------
# Port 80 handles the HTTP traffic and points to the machines that
# run the Ingress Controller pods.
#---------------------------------------------------------------------
listen ingress-router-80
  bind *:80
  mode tcp
  balance source
  server worker0 worker0.<cluster-name>.<base-domain>:80 check inter 1s
  server worker1 worker1.<cluster-name>.<base-domain>:80 check inter 1s
  server worker2 worker2.<cluster-name>.<base-domain>:80 check inter 1s